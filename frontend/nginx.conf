log_format library_api_safe '$remote_addr $request_method $uri $status';
server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 52m;
 location = /api/catalog-files {
  access_log /var/log/nginx/access.log library_api_safe;
  client_max_body_size 1024m;
  client_body_timeout 300s;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_pass http://api:8000;
  proxy_set_header Host $http_host;
  proxy_send_timeout 300s;
  proxy_read_timeout 600s;
 }
 location /api/ { access_log /var/log/nginx/access.log library_api_safe; proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_read_timeout 150s; }
 location / { try_files $uri $uri/ /index.html; }
}
