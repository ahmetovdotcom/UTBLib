log_format library_api_safe '$remote_addr $request_method $uri $status';
server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 10m;
 location /api/ { access_log /var/log/nginx/access.log library_api_safe; proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_read_timeout 150s; }
 location / { try_files $uri $uri/ /index.html; }
}
